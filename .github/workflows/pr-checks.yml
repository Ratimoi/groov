name: PR checks

on:
  pull_request:
    branches: [dev, main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  padrao:
    name: Título e branch
    runs-on: ubuntu-latest
    steps:
      # Conventional Commits no título (o merge commit leva o título do PR para o histórico).
      - name: Título do PR
        env:
          TITULO: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$TITULO" | grep -Eq '^(feat|fix|test|chore|docs|refactor|release|hotfix)(\([a-z0-9._-]+\))?: .+'; then
            echo "::error::Título fora do padrão: \"$TITULO\". Use tipo: descrição (feat, fix, test, chore, docs, refactor, release ou hotfix), por exemplo \"feat: tela de pagamento\"."
            exit 1
          fi

      # feature/, fix/, test/, chore/, docs/ e hotfix/ (CONTRIBUTING). PRs de release saem da dev;
      # o Dependabot usa o próprio prefixo.
      - name: Nome da branch
        env:
          ORIGEM: ${{ github.head_ref }}
          DESTINO: ${{ github.base_ref }}
        run: |
          if [ "$DESTINO" = "main" ] && [ "$ORIGEM" = "dev" ]; then exit 0; fi
          if printf '%s' "$ORIGEM" | grep -Eq '^dependabot/'; then exit 0; fi
          if [ "$DESTINO" = "main" ] && ! printf '%s' "$ORIGEM" | grep -Eq '^hotfix/'; then
            echo "::error::Para a main só entram dev (release) ou hotfix/*; a branch é \"$ORIGEM\"."
            exit 1
          fi
          if ! printf '%s' "$ORIGEM" | grep -Eq '^(feature|fix|test|chore|docs|hotfix)/[a-z0-9._-]+$'; then
            echo "::error::Nome de branch fora do padrão: \"$ORIGEM\". Use feature/, fix/, test/, chore/, docs/ ou hotfix/ seguido de minúsculas e hífens."
            exit 1
          fi

  rotulos:
    name: Rótulos por área
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v5
        with:
          sync-labels: true
