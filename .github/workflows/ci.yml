name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Postgres descartável só para validar as migrações do Prisma (não é o banco de produção).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: groov
          POSTGRES_PASSWORD: groov
          POSTGRES_DB: groov_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U groov -d groov_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATIONS_DATABASE_URL: postgresql://groov:groov@localhost:5432/groov_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck
      - run: npm test
      - run: npm run build --if-present

      # As migrações precisam rodar do zero num banco vazio...
      - name: Aplica as migrações num banco vazio
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.MIGRATIONS_DATABASE_URL }}

      # Fluxo de compra com Postgres de verdade: transações, concorrência e expiração.
      - name: Testes de integração (Postgres real)
        run: npx vitest run tests/integration
        env:
          INTEGRATION_DATABASE_URL: ${{ env.MIGRATIONS_DATABASE_URL }}

      # ...e o resultado precisa ser idêntico ao schema.prisma. Falha se alguém mudar o schema sem
      # criar a migração, ou apagar migrações (o banco de produção nunca receberia a mudança).
      - name: Confere que o schema não tem alterações sem migração
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
        env:
          DATABASE_URL: ${{ env.MIGRATIONS_DATABASE_URL }}

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck
      - run: npm test --if-present
      - run: npm run export:android

  deploy-database:
    name: Deploy - Migrações (Neon)
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-database
      cancel-in-progress: false
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy-backend:
    name: Deploy - API (Render)
    needs: [deploy-database]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    steps:
      - name: Dispara o deploy no Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK_URL não configurado no environment production"
            exit 1
          fi
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"

  deploy-frontend:
    name: Deploy - Frontend (EAS Update)
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-frontend
      cancel-in-progress: false
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci
      - run: eas update --branch production --message "${{ github.sha }}" --non-interactive
